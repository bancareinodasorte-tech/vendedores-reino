<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINEL DE VENDEDORES</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:linear-gradient(#2f58cf,#0a2679);
  color:#fff;
}

.container { max-width:900px; margin:auto; padding:10px; }

.topo { text-align:center; margin-bottom:15px; }

.btn-cadastro {
  background:linear-gradient(#8cdc70,#6fc657);
  padding:16px;
  border-radius:20px;
  text-align:center;
  font-weight:bold;
  margin-bottom:20px;
}

.cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.card {
  background:rgba(255,255,255,.1);
  padding:12px;
  border-radius:20px;
  text-align:center;
}

.atualizacao {
  text-align:center;
  margin:15px 0;
}

/* 🔥 CARD ESCRITÓRIO PREMIUM */
.office-card {
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(135deg,#0c2d8a,#071a4d);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid rgba(255,215,108,.5);
}

.office-left { flex:1; }

.office-title {
  color:#ffd76c;
  font-weight:bold;
  font-size:18px;
}

.office-sub {
  font-size:13px;
  color:#ccc;
}

.office-mini {
  font-size:12px;
  margin-top:6px;
}

.office-divider {
  width:1px;
  height:60px;
  background:rgba(255,255,255,.2);
}

.office-right {
  flex:1;
  text-align:right;
}

.office-btn {
  background:linear-gradient(#25d366,#128c4a);
  padding:10px 15px;
  border-radius:15px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

/* vendedores */
.lista { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.vendedor {
  background:rgba(255,255,255,.1);
  border-radius:20px;
  padding:10px;
  text-align:center;
}

.percentual { display:none; } /* escondido */
</style>
</head>

<body>

<div class="container">

<div class="topo">
<h2>REINO DA SORTE</h2>
<h1>PAINEL DE VENDEDORES</h1>
<p>CADA BILHETE COM 20 CHANCES - R$ 2,00</p>
</div>

<div class="btn-cadastro">QUERO SER VENDEDOR AUTORIZADO</div>

<div class="cards">
<div class="card">PRÓXIMO SORTEIO</div>
<div class="card">ÚLTIMO GANHADOR</div>
</div>

<div class="atualizacao">Última atualização: aguardando</div>

<!-- 🔥 CARD NOVO -->
<div class="office-card">

  <div class="office-left">
    <div class="office-title">REINO DA SORTE</div>
    <div class="office-sub">Atendimento oficial da empresa</div>

    <div class="office-mini">
      ✔ Seguro • ⚡ Rápido • 🎧 Oficial
    </div>
  </div>

  <div class="office-divider"></div>

  <div class="office-right">
    <div>COMPRE DIRETO</div>

    <a class="office-btn" href="https://wa.me/5588994943632?text=Olá!%20Quero%20comprar%20bilhetes">
      🟢 COMPRAR
    </a>
  </div>

</div>

<h2 style="text-align:center;">VENDEDORES</h2>

<div class="lista" id="lista"></div>

</div>

<script>
const vendedores = [
  {nome:"Alice"},
  {nome:"Dan"},
  {nome:"Aline"},
  {nome:"Márcia"}
];

const lista = document.getElementById("lista");

vendedores.forEach(v => {
  lista.innerHTML += `
    <div class="vendedor">
      <p>${v.nome}</p>
      <div class="percentual">0%</div>
      <a href="#">COMPRAR</a>
    </div>
  `;
});
</script>

</body>
</html>
