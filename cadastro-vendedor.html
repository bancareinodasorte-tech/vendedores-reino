<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Vendedor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #0a3d91;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.radio-group {
    margin-top: 5px;
}

.radio-group label {
    font-weight: normal;
    display: block;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: gray;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: not-allowed;
}

button.active {
    background: #28a745;
    cursor: pointer;
}

.info {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #555;
}

.checkbox {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>SEJA UM VENDEDOR AUTORIZADO</h1>

<label>Nome completo</label>
<input type="text" id="nome" required>

<label>CPF</label>
<input type="text" id="cpf" required>

<label>E-mail para acesso</label>
<input type="email" id="email" required>

<label>Crie uma senha (mínimo 6 caracteres)</label>
<input type="password" id="senha" minlength="6" required>

<label>Telefone</label>
<input type="text" id="telefone" required>

<label>Cidade</label>
<input type="text" id="cidade" required>

<label>Escolha modalidade</label>
<select id="modalidade">
    <option>Online (celular)</option>
    <option>Maquininha</option>
    <option>Banca c/ maquininha</option>
    <option>Maquininha + Online</option>
    <option>Banca + Online</option>
</select>

<label>Seu celular é?</label>
<select id="celular">
    <option>Android</option>
    <option>iPhone</option>
</select>

<label>Disponibilidade (descreva)</label>
<textarea id="disponibilidade"></textarea>

<div class="checkbox">
<label>
<input type="checkbox" id="confirmacao">
 Sim, tenho interesse e disponibilidade diária para trabalhar como vendedor(a).
</label>
</div>

<button id="enviar" disabled>Enviar para análise</button>

<div class="info">
Clique no botão e confirme o envio pelo WhatsApp
</div>

</div>

<script>

function enviarCadastro() {
  const nome = document.getElementById('nome').value;
  const cpf = document.getElementById('cpf').value;

  // 🔴 BLOQUEIO DE CPF DUPLICADO
  const ultimoCpf = localStorage.getItem('cpf_enviado');

  if (ultimoCpf === cpf) {
    alert('⚠️ Este CPF já foi enviado para análise.');
    return;
  }

  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const telefone = document.getElementById('telefone').value;
  const cidade = document.getElementById('cidade').value;
  const modalidade = document.getElementById('modalidade').value;
  const celular = document.getElementById('celular').value;
  const disponibilidade = document.getElementById('disponibilidade').value;
  const confirmacao = document.getElementById('confirmacao');

  if (!confirmacao.checked) {
    alert('Você precisa confirmar disponibilidade.');
    return;
  }

  const mensagem =
`Quero ser vendedor autorizado

Nome: ${nome}
CPF: ${cpf}
E-mail: ${email}
Senha: ${senha}
Telefone: ${telefone}
Cidade: ${cidade}
Modalidade: ${modalidade}
Celular: ${celular}
Disponibilidade: ${disponibilidade}`;

  const numero = '5588994943632';

  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

  // 🔴 SALVA CPF COMO ENVIADO
  localStorage.setItem('cpf_enviado', cpf);

  // 🔴 ABRE WHATSAPP
  window.open(url, '_blank');

  // 🔴 LIMPA FORMULÁRIO
  document.querySelectorAll('input, select').forEach(el => el.value = '');

}

</script>

</body>
</html>
