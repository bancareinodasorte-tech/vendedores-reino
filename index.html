<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendedores Autorizados | Reino da Sorte</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --azul-1: #041b52;
      --azul-2: #0b46b5;
      --azul-card: rgba(255,255,255,0.09);
      --borda: rgba(255,255,255,0.14);
      --dourado: #ffd76a;
      --texto-suave: #dce7ff;
      --verde: #25D366;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #1354d1 0%, #082a7c 35%, #041b52 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1150px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .hero {
      text-align: center;
      padding: 8px 8px 22px;
    }

    .hero-logo {
      width: min(280px, 78vw);
      max-width: 280px;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.28));
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.05;
      font-weight: 800;
    }

    .hero p {
      margin: 0 auto;
      max-width: 760px;
      color: var(--texto-suave);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.5;
    }

    .aviso {
      margin: 0 auto 22px;
      max-width: 900px;
      text-align: center;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff3bf;
      font-size: 15px;
      line-height: 1.45;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.07));
      border: 1px solid var(--borda);
      border-radius: 22px;
      padding: 18px 16px 16px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 40%);
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 42px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #102a5f;
      background: linear-gradient(180deg, #ffe89a, #ffd76a);
      box-shadow: 0 6px 16px rgba(0,0,0,0.16);
      z-index: 2;
    }

    .foto-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .foto {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid rgba(255, 235, 170, 0.92);
      box-shadow:
        0 6px 18px rgba(0,0,0,0.22),
        inset 0 0 0 2px rgba(255,255,255,0.35);
      background: #fff;
    }

    .fallback {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      color: #14357b;
      background: linear-gradient(180deg, #fff2c5, #ffd76a);
      border: 4px solid rgba(255, 235, 170, 0.92);
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }

    .nome {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      margin: 0 0 14px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(180deg, #34e27a, #25D366);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 13px 14px;
      border-radius: 14px;
      box-shadow: 0 10px 18px rgba(21, 156, 72, 0.26);
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .rodape {
      text-align: center;
      margin-top: 26px;
      color: var(--texto-suave);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 16px 10px 28px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .nome {
        font-size: 24px;
        min-height: auto;
      }

      .foto,
      .fallback {
        width: 88px;
        height: 88px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <img class="hero-logo" src="images/logo-reino.png" alt="Logo Reino da Sorte">
      <h1>Vendedores Autorizados</h1>
      <p>
        Escolha um vendedor autorizado e envie seu pedido de forma rápida, prática e segura pelo WhatsApp.
      </p>
    </section>

    <div class="aviso">
      Toque no botão do vendedor para abrir a conversa já com o pedido pronto para preenchimento.
    </div>

    <section id="lista" class="grid"></section>

    <div class="rodape">
      REINO DA SORTE • Atendimento oficial
    </div>
  </div>

  <script>
    const mensagem = encodeURIComponent(
`Olá, faça meu pedido.

Bilhetes:
Nome:
Contato:
Forma de pagamento:
1. Pix
2. Dinheiro`
    );

    const vendedores = [
      {
        nome: "Aline dos Maroto",
        telefone: "5588981176361",
        foto: "images/aline-dos-maroto.jpg"
      },
      {
        nome: "Jamilles Izidório",
        telefone: "5588981477848",
        foto: "images/jamilles-izidorio.jpg"
      },
      {
        nome: "Dan",
        telefone: "5588981703564",
        foto: "images/dan.jpg"
      },
      {
        nome: "Alice Nabor",
        telefone: "5588981296930",
        foto: "images/alice-nabor.jpg"
      },
      {
        nome: "Jéssica Ferreira",
        telefone: "5588981794095",
        foto: "images/jessica-ferreira.jpg"
      },
      {
        nome: "Taína Fideles",
        telefone: "5588981805250",
        foto: "images/taina-fideles.jpg"
      },
      {
        nome: "Samara",
        telefone: "5588988158745",
        foto: "images/samara.jpg"
      },
      {
        nome: "Maria Oliveira",
        telefone: "5588996263082",
        foto: "images/maria-oliveira.jpg"
      },
      {
        nome: "Caeline",
        telefone: "5588981612830",
        foto: "images/caeline.jpg"
      },
      {
        nome: "Kyara",
        telefone: "5585988725043",
        foto: "images/kyara.jpg"
      },
      {
        nome: "Taty",
        telefone: "5588988653443",
        foto: "images/taty.jpg"
      },
      {
        nome: "Ana Raíssa",
        telefone: "5588988940412",
        foto: "images/ana-raissa.jpg"
      },
      {
        nome: "Beta",
        telefone: "5588981438746",
        foto: "images/beta.jpg"
      }
    ];

    const medals = ["🥇", "🥈", "🥉"];
    const lista = document.getElementById("lista");

    vendedores.forEach((vendedor, index) => {
      const posicao = index < 3 ? medals[index] : "#" + (index + 1);
      const iniciais = vendedor.nome
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(p => p[0])
        .join("")
        .toUpperCase();

      const linkWhatsapp = `https://wa.me/${vendedor.telefone}?text=${mensagem}`;

      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <div class="badge">${posicao}</div>

        <div class="foto-wrap">
          <img
            class="foto"
            src="${vendedor.foto}"
            alt="${vendedor.nome}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="fallback">${iniciais}</div>
        </div>

        <h2 class="nome">${vendedor.nome}</h2>

        <a class="btn" href="${linkWhatsapp}" target="_blank" rel="noopener noreferrer">
          Falar no WhatsApp
        </a>
      `;

      lista.appendChild(card);
    });
  </script>
</body>
</html>
