  { id: "taty", nome: "Taty", telefone: "5588988653443", foto: "images/taty.jpg" },
  { id: "luana", nome: "Luana", telefone: "5588988132520", foto: "images/vendedora-semfoto.jpg" },

  { id: "kyara", nome: "Kyara", telefone: "5585988725043", foto: "images/kyara.jpg" },
  { id: "jessica", nome: "Jéssica Ferreira", telefone: "5588981794095", foto: "images/jessica-ferreira.jpg" },

  { id: "maria-luana", nome: "Maria Luana", telefone: "5588988898619", foto: "images/vendedora.jpg" }
];

const lista = document.getElementById("lista");

function linkZap(v) {
  return `https://wa.me/${v.telefone}?text=Quero%20comprar%20bilhetes`;
}

function render(vendedores) {
  lista.innerHTML = "";

  vendedores.forEach((v, i) => {
    const pos = i + 1;
    const medal = pos === 1 ? "🥇" : pos === 2 ? "🥈" : pos === 3 ? "🥉" : "#" + pos;

    lista.innerHTML += `
    <div class="card">
      <div class="badge">${medal}</div>
      <img src="${v.foto}" class="photo">
      <h2>${v.nome}</h2>
      <p style="text-align:center;font-weight:bold;">
        Participação: ${v.percentual ? v.percentual.toFixed(1) : 0}%
      </p>
      <a href="${linkZap(v)}" class="btn">COMPRAR</a>
    </div>
    `;
  });
}

async function carregar() {
  try {
    const r = await fetch("ranking.json?"+Date.now());
    const data = await r.json();

    const listaFinal = data.map(rk => {
      const base = vendedoresBase.find(v => v.id === rk.id);
      return {
        ...base,
        percentual: rk.percentual
      };
    });

    render(listaFinal);

  } catch {
    render(vendedoresBase);
  }
}

carregar();
</script>
