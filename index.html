<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vendedores Reino da Sorte</title>

  <style>
    body {
      font-family: Arial;
      background: #0b2c6b;
      margin: 0;
      color: white;
      text-align: center;
    }

    .topo {
      padding: 20px;
    }

    .topo img {
      width: 180px;
    }

    h1 {
      margin: 10px 0;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: #123c8d;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid gold;
    }

    .nome {
      font-weight: bold;
      margin: 10px 0;
    }

    .botao {
      display: inline-block;
      padding: 8px 12px;
      background: #25D366;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }

    .rodape {
      margin: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="topo">
  <img src="https://i.imgur.com/SeuLogoAqui.png">
  <h1>TOP VENDEDORES</h1>
  <p>Escolha e fale direto no WhatsApp</p>
</div>

<div class="container">

  <!-- EXEMPLO (vamos substituir depois) -->
  <div class="card">
    <img src="https://via.placeholder.com/100">
    <div class="nome">Nome Vendedor</div>
    <a class="botao" href="https://wa.me/5500000000000?text=Olá%20quero%20comprar%20bilhetes">
      Falar no WhatsApp
    </a>
  </div>

</div>

<div class="rodape">
  REINO DA SORTE • Vendedores autorizados
</div>

</body>
</html>
