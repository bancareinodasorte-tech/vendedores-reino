<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Vendedores Autorizados | Reino da Sorte</title>

  <meta name="theme-color" content="#0c36a5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-top: #2f58cf;
      --bg-mid: #1844bb;
      --bg-bottom: #0a2679;
      --card: rgba(255, 255, 255, 0.1);
      --card-2: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: #dde8ff;
      --gold: #ffd76c;
      --gold-soft: #fff1bb;
      --green-1: #3be67f;
      --green-2: #25d366;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background:
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.8) 0 1px, transparent 2px) 0 0/130px 130px,
        radial-gradient(circle at 85% 18%, rgba(255,220,120,.95) 0 1px, transparent 2px) 0 0/170px 170px,
        radial-gradient(circle at 60% 76%, rgba(255,255,255,.75) 0 1px, transparent 2px) 0 0/150px 150px,
        radial-gradient(circle at 25% 65%, rgba(255,220,120,.8) 0 1px, transparent 2px) 0 0/180px 180px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding:
        env(safe-area-inset-top)
        14px
        calc(24px + env(safe-area-inset-bottom));
      position: relative;
    }

    .hero {
      text-align: center;
      padding: 10px 4px 20px;
      animation: fadeUp 0.55s ease both;
    }

    .logo-wrap {
      width: min(290px, 78vw);
      margin: 8px auto 16px;
      position: relative;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 10% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,0) 70%);
      filter: blur(16px);
      z-index: 0;
    }

    .logo {
      width: 100%;
      display: block;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 14px 26px rgba(0,0,0,.24));
    }

    .logo-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;
      padding: 18px;
      text-align: center;
      font-weight: 800;
      color: var(--gold-soft);
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .brand {
      color: var(--gold);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 9vw, 58px);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-shadow: 0 4px 16px rgba(0,0,0,.16);
    }

    .hero p {
      margin: 14px auto 0;
      max-width: 94%;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.52;
    }

    .alert {
      margin: 0 0 18px;
      padding: 16px 18px;
      text-align: center;
      color: #fff2ca;
      font-size: 15px;
      line-height: 1.5;
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.06));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      animation: fadeUp 0.62s ease both;
      animation-delay: 0.05s;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.07));
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transform: translateY(22px) scale(0.985);
      opacity: 0;
      animation: cardIn 0.55s ease forwards;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 34%),
        radial-gradient(circle at top center, rgba(255,255,255,.06), transparent 48%);
    }

    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      min-width: 52px;
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffe99d, #ffd86f);
      color: #19357b;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
      z-index: 2;
    }

    .photo-wrap {
      display: flex;
      justify-content: center;
      margin: 8px 0 16px;
    }

    .photo {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #fff;
      border: 4px solid rgba(255,238,173,.96);
      box-shadow:
        0 10px 22px rgba(0,0,0,.22),
        inset 0 0 0 2px rgba(255,255,255,.35);
    }

    .fallback {
      display: none;
      align-items: center;
      justify-content: center;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff0bc, #ffd86f);
      color: #17397f;
      font-size: 34px;
      font-weight: 900;
      border: 4px solid rgba(255,238,173,.96);
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
    }

    .name {
      margin: 0 0 16px;
      text-align: center;
      font-size: 28px;
      line-height: 1.08;
      font-weight: 900;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 4px 14px rgba(0,0,0,.14);
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      text-align: center;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--green-1), var(--green-2));
      box-shadow:
        0 12px 22px rgba(31,170,83,.28),
        inset 0 1px 0 rgba(255,255,255,.16);
      transform: translateY(0) scale(1);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      user-select: none;
    }

    .btn:hover {
      filter: brightness(1.03);
    }

    .btn:active,
    .btn.touching {
      transform: scale(0.985);
      filter: brightness(0.98);
      box-shadow:
        0 8px 16px rgba(31,170,83,.24),
        inset 0 1px 0 rgba(255,255,255,.14);
    }

    .btn-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: block;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
      padding-bottom: 6px;
      opacity: 0.96;
      animation: fadeUp 0.72s ease both;
      animation-delay: 0.12s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 390px) {
      .name {
        font-size: 24px;
      }

      .photo,
      .fallback {
        width: 108px;
        height: 108px;
      }

      .btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="logo-wrap">
        <img
          class="logo"
          src="logo-reino.png"
          alt="Logo Reino da Sorte"
          onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';"
        />
        <div class="logo-fallback" id="logoFallback">Logo Reino da Sorte</div>
      </div>

      <div class="brand">REINO DA SORTE</div>
      <h1>Vendedores<br>Autorizados</h1>
      <p>
        Escolha um vendedor autorizado e envie seu pedido de forma rápida,
        prática e segura pelo WhatsApp.
      </p>
    </section>

    <div class="alert">
      Toque no botão do vendedor para abrir a conversa já com o pedido pronto para preenchimento.
    </div>

    <section class="list" id="lista"></section>

    <div class="footer">
      REINO DA SORTE • Atendimento oficial
    </div>
  </main>

  <script>
    const mensagem = encodeURIComponent(
`Olá, faça meu pedido.

Bilhetes:
Nome:
Contato:
Forma de pagamento:
1. Pix
2. Dinheiro`
    );

    const vendedores = [
      { nome: "Aline dos Maroto", telefone: "5588981176361", foto: "images/aline-dos-maroto.jpg" },
      { nome: "Jamilles Izidório", telefone: "5588981477848", foto: "images/jamilles-izidorio.jpg" },
      { nome: "Dan", telefone: "5588981703564", foto: "images/dan.jpg" },
      { nome: "Alice Nabor", telefone: "5588981296930", foto: "images/alice-nabor.jpg" },
      { nome: "Jéssica Ferreira", telefone: "5588981794095", foto: "images/jessica-ferreira.jpg" },
      { nome: "Taína Fideles", telefone: "5588981805250", foto: "images/taina-fideles.jpg" },
      { nome: "Samara", telefone: "5588988158745", foto: "images/samara.jpg" },
      { nome: "Maria Oliveira", telefone: "5588996263082", foto: "images/maria-oliveira.jpg" },
      { nome: "Caeline", telefone: "5588981612830", foto: "images/caeline.jpg" },
      { nome: "Kyara", telefone: "5585988725043", foto: "images/kyara.jpg" },
      { nome: "Taty", telefone: "5588988653443", foto: "images/taty.jpg" },
      { nome: "Ana Raíssa", telefone: "5588988940412", foto: "images/ana-raissa.jpg" },
      { nome: "Beta", telefone: "5588981438746", foto: "images/beta.jpg" }
    ];

    const medals = ["🥇", "🥈", "🥉"];
    const lista = document.getElementById("lista");

    vendedores.forEach((vendedor, index) => {
      const posicao = index < 3 ? medals[index] : "#" + (index + 1);
      const iniciais = vendedor.nome
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(parte => parte[0])
        .join("")
        .toUpperCase();

      const linkWhatsapp = `https://wa.me/${vendedor.telefone}?text=${mensagem}`;

      const card = document.createElement("article");
      card.className = "card";
      card.style.animationDelay = `${0.05 + index * 0.04}s`;

      card.innerHTML = `
        <div class="badge">${posicao}</div>

        <div class="photo-wrap">
          <img
            class="photo"
            src="${vendedor.foto}"
            alt="${vendedor.nome}"
            loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="fallback">${iniciais}</div>
        </div>

        <h2 class="name">${vendedor.nome}</h2>

        <a
          class="btn"
          href="${linkWhatsapp}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Falar no WhatsApp com ${vendedor.nome}"
        >
          <svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path fill="currentColor" d="M19.11 17.24c-.29-.15-1.69-.83-1.95-.92-.26-.1-.45-.15-.64.15-.19.29-.73.92-.9 1.11-.16.19-.33.22-.62.07-.29-.15-1.2-.44-2.28-1.39-.84-.75-1.4-1.66-1.56-1.95-.16-.29-.02-.44.12-.58.12-.12.29-.33.43-.49.14-.16.19-.29.29-.49.1-.19.05-.36-.02-.51-.07-.15-.64-1.55-.88-2.12-.23-.55-.47-.47-.64-.48h-.55c-.19 0-.49.07-.75.36-.26.29-.98.95-.98 2.31s1 2.67 1.14 2.86c.14.19 1.96 2.99 4.76 4.19.67.29 1.19.46 1.6.59.67.21 1.28.18 1.77.11.54-.08 1.69-.69 1.93-1.35.24-.66.24-1.22.17-1.34-.07-.12-.26-.19-.55-.34z"/>
            <path fill="currentColor" d="M16.02 3.2c-7.05 0-12.76 5.7-12.76 12.73 0 2.24.59 4.43 1.7 6.35L3.2 28.8l6.72-1.75a12.8 12.8 0 0 0 6.1 1.55h.01c7.04 0 12.77-5.7 12.77-12.73A12.75 12.75 0 0 0 16.02 3.2zm0 23.25h-.01c-1.92 0-3.8-.52-5.45-1.51l-.39-.23-3.99 1.04 1.07-3.89-.25-.4a10.54 10.54 0 0 1-1.63-5.61c0-5.83 4.76-10.58 10.62-10.58 2.83 0 5.48 1.1 7.48 3.09a10.47 10.47 0 0 1 3.11 7.49c0 5.83-4.77 10.58-10.56 10.58z"/>
          </svg>
          <span>Falar no WhatsApp</span>
        </a>
      `;

      lista.appendChild(card);
    });

    document.querySelectorAll(".btn").forEach(btn => {
      const ligar = () => btn.classList.add("touching");
      const desligar = () => btn.classList.remove("touching");

      btn.addEventListener("touchstart", ligar, { passive: true });
      btn.addEventListener("touchend", desligar);
      btn.addEventListener("touchcancel", desligar);
      btn.addEventListener("mousedown", ligar);
      btn.addEventListener("mouseup", desligar);
      btn.addEventListener("mouseleave", desligar);
    });
  </script>
</body>
</html>
