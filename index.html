<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VENDEDORES AUTORIZADOS | Reino da Sorte</title>
  <meta name="theme-color" content="#0c2f86" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-1: #081f61;
      --bg-2: #0f43b6;
      --bg-3: #061844;
      --card: rgba(255,255,255,0.10);
      --card-2: rgba(255,255,255,0.07);
      --line: rgba(255,255,255,0.14);
      --gold: #ffd86f;
      --gold-2: #fff1bf;
      --text: #ffffff;
      --muted: #dbe6ff;
      --green-1: #38e57f;
      --green-2: #25D366;
      --shadow: 0 14px 34px rgba(0,0,0,.20);
      --radius: 24px;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, #1a56d3 0%, var(--bg-2) 25%, var(--bg-1) 65%, var(--bg-3) 100%);
      min-height: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background:
        radial-gradient(circle at 20% 20%, #ffffff 0 1px, transparent 2px) 0 0/110px 110px,
        radial-gradient(circle at 80% 40%, #ffe38d 0 1px, transparent 2px) 0 0/140px 140px,
        radial-gradient(circle at 40% 80%, #ffffff 0 1px, transparent 2px) 0 0/130px 130px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 14px 28px;
      position: relative;
    }

    .status-space {
      height: 4px;
    }

    .hero {
      text-align: center;
      padding: 10px 8px 20px;
    }

    .logo-wrap {
      width: min(280px, 72vw);
      height: min(280px, 72vw);
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 70%);
      filter: blur(12px);
    }

    .logo {
      width: 100%;
      max-width: 260px;
      object-fit: contain;
      display: block;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.28));
    }

    .logo-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      padding: 18px;
      text-align: center;
      font-weight: 800;
      line-height: 1.15;
      color: var(--gold-2);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: var(--shadow);
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 58px);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -.5px;
      text-shadow: 0 4px 16px rgba(0,0,0,.14);
    }

    .hero p {
      margin: 14px auto 0;
      max-width: 92%;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .alert {
      margin: 0 0 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 18px;
      text-align: center;
      color: #fff2c7;
      line-height: 1.45;
      font-size: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.07));
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 18px 18px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 35%),
        radial-gradient(circle at top center, rgba(255,255,255,.05), transparent 45%);
      pointer-events: none;
    }

    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      min-width: 48px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffe99e, #ffd86f);
      color: #16306f;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
      z-index: 2;
    }

    .photo-wrap {
      display: flex;
      justify-content: center;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .photo {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #fff;
      border: 4px solid rgba(255, 238, 173, .95);
      box-shadow:
        0 10px 22px rgba(0,0,0,.22),
        inset 0 0 0 2px rgba(255,255,255,.35);
    }

    .fallback {
      display: none;
      align-items: center;
      justify-content: center;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff1bd, #ffd86f);
      color: #17397f;
      font-size: 34px;
      font-weight: 900;
      border: 4px solid rgba(255, 238, 173, .95);
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
    }

    .name {
      margin: 0 0 18px;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.08;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 4px 14px rgba(0,0,0,.15);
    }

    .btn {
      display: block;
      width: 100%;
      border: 0;
      text-decoration: none;
      text-align: center;
      font-weight: 900;
      font-size: 17px;
      color: #fff;
      padding: 16px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--green-1), var(--green-2));
      box-shadow:
        0 12px 20px rgba(31, 170, 83, .28),
        inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .14s ease, filter .14s ease;
    }

    .btn:active {
      transform: scale(.985);
      filter: brightness(.98);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
      padding-bottom: 10px;
    }

    @media (max-width: 380px) {
      .name {
        font-size: 24px;
      }

      .photo,
      .fallback {
        width: 108px;
        height: 108px;
      }

      .btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="status-space"></div>

    <section class="hero">
      <div class="logo-wrap">
        <img
          class="logo"
          src="logo-reino.png"
          alt="Logo Reino da Sorte"
          onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';"
        />
        <div class="logo-fallback" id="logoFallback">
          Logo Reino da Sorte
        </div>
      </div>

      <div class="brand">REINO DA SORTE</div>
      <h1>Vendedores Autorizados</h1>
      <p>
        Escolha um vendedor autorizado e envie seu pedido de forma rápida,
        prática e segura pelo WhatsApp.
      </p>
    </section>

    <div class="alert">
      Toque no botão do vendedor para abrir a conversa já com o pedido pronto para preenchimento.
    </div>

    <section class="grid" id="lista"></section>

    <div class="footer">
      REINO DA SORTE • Atendimento oficial
    </div>
  </main>

  <script>
    const mensagem = encodeURIComponent(
`Olá, faça meu pedido.

Bilhetes:
Nome:
Contato:
Forma de pagamento:
1. Pix
2. Dinheiro`
    );

    const vendedores = [
      { nome: "Aline dos Maroto", telefone: "5588981176361", foto: "aline-dos-maroto.jpg.JPG" },
      { nome: "Jamilles Izidório", telefone: "5588981477848", foto: "jamilles-izidorio.jpg.JPG" },
      { nome: "Dan", telefone: "5588981703564", foto: "dan.jpg.JPG" },
      { nome: "Alice Nabor", telefone: "5588981296930", foto: "alice-nabor.jpg.JPG" },
      { nome: "Jéssica Ferreira", telefone: "5588981794095", foto: "jessica-ferreira.jpg.jpg" },
      { nome: "Taína Fideles", telefone: "5588981805250", foto: "taina-fideles.jpg.JPG" },
      { nome: "Samara", telefone: "5588988158745", foto: "samara.jpg.JPG" },
      { nome: "Maria Oliveira", telefone: "5588996263082", foto: "maria-oliveira.jpg.JPG" },
      { nome: "Caeline", telefone: "5588981612830", foto: "caeline.jpg.JPG" },
      { nome: "Kyara", telefone: "5585988725043", foto: "kyara.jpg.JPG" },
      { nome: "Taty", telefone: "5588988653443", foto: "taty.jpg.JPG" },
      { nome: "Ana Raíssa", telefone: "5588988940412", foto: "ana-raissa.jpg.JPG" },
      { nome: "Beta", telefone: "5588981438746", foto: "beta.jpg.JPG" }
    ];

    const medals = ["🥇", "🥈", "🥉"];
    const lista = document.getElementById("lista");

    vendedores.forEach((vendedor, index) => {
      const posicao = index < 3 ? medals[index] : "#" + (index + 1);
      const iniciais = vendedor.nome
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(p => p[0])
        .join("")
        .toUpperCase();

      const linkWhatsapp = `https://wa.me/${vendedor.telefone}?text=${mensagem}`;

      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <div class="badge">${posicao}</div>

        <div class="photo-wrap">
          <img
            class="photo"
            src="${vendedor.foto}"
            alt="${vendedor.nome}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="fallback">${iniciais}</div>
        </div>

        <h2 class="name">${vendedor.nome}</h2>

        <a class="btn" href="${linkWhatsapp}" target="_blank" rel="noopener noreferrer">
          Falar no WhatsApp
        </a>
      `;

      lista.appendChild(card);
    });
  </script>
</body>
</html>
